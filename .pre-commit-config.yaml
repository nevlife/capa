# capa pre-commit: formatters, linters and the checks that keep capa's documents and code in step.
exclude: ^thirdparty/  # vendored nanobind stays pristine
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.6
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-format
        types: [python]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^capa_py/capa/

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [-c, .markdownlint.yaml, --fix]

  - repo: local
    hooks:
      # Needs the build's compile commands (scripts/check_clang_tidy.py says where it looks).
      - id: clang-tidy
        name: clang-tidy defect classes (.clang-tidy)
        entry: scripts/check_clang_tidy.py
        language: python
        additional_dependencies: [clang-tidy==22.1.8]
        types_or: [c++, c]
        # One run: a changed header checks every translation unit, so parallel batches multiply.
        require_serial: true

      # Run from capa_daemon/ so rustup picks the toolchain its rust-toolchain.toml pins. Both check
      # the whole crate; clippy also compiles the C++ half of the bridge.
      - id: rustfmt
        name: rustfmt (capa_daemon)
        entry: bash -c 'cd capa_daemon && cargo fmt --check'
        language: system
        files: ^capa_daemon/
        pass_filenames: false

      - id: clippy
        name: clippy (capa_daemon)
        entry: bash -c 'cd capa_daemon && cargo clippy --all-targets --locked -- -D warnings'
        language: system
        files: ^capa_daemon/
        pass_filenames: false

      # Only when the lock file changes: each run fetches the RustSec advisory database.
      # Needs `cargo install cargo-audit` and the network.
      - id: cargo-audit
        name: cargo audit (capa_daemon/Cargo.lock against RustSec)
        entry: bash -c 'cd capa_daemon && cargo audit --deny warnings'
        language: system
        files: ^capa_daemon/Cargo\.lock$
        pass_filenames: false

      - id: flake8
        name: python defect classes (setup.cfg [flake8])
        entry: python3 -m flake8
        language: system
        types: [python]

      # always_run: these read the whole tree, so a pattern naming a subset would let an edit to
      # the rest skip the gate.
      - id: api-docs
        name: every public name is in both user documents
        entry: scripts/check_api_docs.py
        language: script
        pass_filenames: false
        always_run: true

      - id: contracts
        name: contracts name tests that exist
        entry: scripts/check_contracts.py
        language: script
        pass_filenames: false
        always_run: true

      - id: doc-examples
        name: document fences match the compiled examples
        entry: scripts/check_doc_examples.py
        language: script
        pass_filenames: false
        always_run: true
