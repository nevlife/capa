[package]
name = "capad"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "capad"
path = "src/main.rs"

[dependencies]
cxx = "1"
libc = "0.2"

[build-dependencies]
cxx-build = "1"

# Unsafe code is refused except where a module allows it: the bridge and the signal mask.
[lints.rust]
unsafe_code = "deny"

# pedantic, less the lints written for published library APIs. Every unsafe block states why it is
# sound, one operation per block.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
