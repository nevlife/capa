# cyra pre-commit. Enable: pipx install pre-commit && pre-commit install
exclude: ^thirdparty/  # vendored nanobind stays pristine
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.6
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-format
        types: [python]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^cyra_py/cyra/

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [-c, .markdownlint.yaml, --fix]

  - repo: local
    hooks:
      - id: no-emoji
        name: no emoji
        entry: scripts/check_no_emoji.sh
        language: script
        types: [text]

      - id: hangul-md-only
        name: hangul only in .md files
        entry: scripts/check_hangul_md_only.sh
        language: script
        types: [text]

      # Needs the build's compile commands (scripts/check_clang_tidy.py says where it looks).
      - id: clang-tidy
        name: clang-tidy defect classes (.clang-tidy)
        entry: scripts/check_clang_tidy.py
        language: python
        additional_dependencies: [clang-tidy==22.1.8]
        types_or: [c++, c]

      # Both check the whole crate; clippy also compiles the C++ half of the bridge.
      - id: rustfmt
        name: rustfmt (cyra_daemon)
        entry: scripts/cargo.sh fmt --check
        language: script
        files: ^cyra_daemon/
        pass_filenames: false

      - id: clippy
        name: clippy (cyra_daemon)
        entry: scripts/cargo.sh clippy --all-targets --locked -- -D warnings
        language: script
        files: ^cyra_daemon/
        pass_filenames: false

      # Only when the lock file changes: each run fetches the RustSec advisory database.
      # Needs `cargo install cargo-audit` and the network.
      - id: cargo-audit
        name: cargo audit (cyra_daemon/Cargo.lock against RustSec)
        entry: scripts/cargo.sh audit --deny warnings
        language: script
        files: ^cyra_daemon/Cargo\.lock$
        pass_filenames: false

      - id: flake8
        name: python defect classes (setup.cfg [flake8])
        entry: python3 -m flake8
        language: system
        types: [python]

      # always_run: both read the whole tree, so a pattern naming a subset would let an edit to
      # the rest skip the gate.
      - id: api-docs
        name: every public name is in both user documents
        entry: scripts/check_api_docs.py
        language: script
        pass_filenames: false
        always_run: true

      - id: contracts
        name: contracts name tests that exist
        entry: scripts/check_contracts.py
        language: script
        pass_filenames: false
        always_run: true

      - id: doc-examples
        name: document fences match the compiled examples
        entry: scripts/check_doc_examples.py
        language: script
        pass_filenames: false
        always_run: true

      - id: docs-tracked
        name: no untracked files under docs/
        entry: scripts/check_docs_tracked.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: comment-density
        name: comment budget (scripts/comment_budget.txt)
        entry: scripts/check_comment_density.py
        language: script
        pass_filenames: false
        always_run: true
